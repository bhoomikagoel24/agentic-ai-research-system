version: "3.9"

# ─────────────────────────────────────────────
# ARIA — Docker Compose
# ─────────────────────────────────────────────
# Usage:
#   cp .env.example .env          # fill in your API keys
#   docker compose up --build     # first run (builds images)
#   docker compose up             # subsequent runs (uses cached images)
#   docker compose down           # stop everything
#   docker compose logs -f api    # tail API logs only
# ─────────────────────────────────────────────

services:

  # ── FastAPI backend ──────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: aria-api:latest
    container_name: aria-api
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # Persist ChromaDB / cache across container restarts
      # Without this, every `docker compose down` wipes your vector store
      - aria_data:/home/aria/app/data
      - aria_cache:/home/aria/app/cache
      - aria_logs:/home/aria/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Streamlit UI ─────────────────────────────
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: aria-ui:latest
    container_name: aria-ui
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - aria_data:/home/aria/app/data
      - aria_cache:/home/aria/app/cache
      - aria_logs:/home/aria/app/logs
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

# ─────────────────────────────────────────────
# NAMED VOLUMES
# Docker-managed persistent storage.
# Lives at /var/lib/docker/volumes/ on the host.
# `docker compose down -v` removes them (careful — deletes ChromaDB too).
# ─────────────────────────────────────────────
volumes:
  aria_data:
  aria_cache:
  aria_logs:
